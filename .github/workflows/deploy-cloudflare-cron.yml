name: Deploy Cloudflare Cron Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/cron-worker/**"
      - ".github/workflows/deploy-cloudflare-cron.yml"

concurrency:
  group: cloudflare-cron-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-cron-worker:
    name: Deploy cron worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # wrangler-action v4 defaults to Wrangler v4 and runs on the Node 24
      # runner; v3 pinned Wrangler 3.90.0, which fails on Node 24 runners.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cron-worker
          command: deploy
