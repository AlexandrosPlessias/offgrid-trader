name: App Power
run-name: App Power — ${{ inputs.action || 'scheduled' }}

# Manually take the app offline or bring it back online, OR let the
# cron schedule do it automatically around US market hours (EDT anchor):
#   Start  ~8:30 AM ET  Mon–Fri  →  12:30 UTC  (1 h before market open)
#   Stop   ~5:00 PM ET  Mon–Fri  →  21:00 UTC  (1 h after  market close)
# Note: times shift ~1 h during winter EST — acceptable trade-off.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Take the app offline (stop) or bring it back online (start)'
        required: true
        type: choice
        options: [stop, start]
      confirm:
        description: 'Type the app name to confirm: offgrid-trader'
        required: true
        type: string
        default: 'offgrid-trader'
  schedule:
    - cron: '30 12 * * 1-5'   # Auto-start: ~8:30 AM ET Mon–Fri (EDT)
    - cron: '0 21 * * 1-5'    # Auto-stop:  ~5:00 PM ET Mon–Fri (EDT)

env:
  FLY_APP: offgrid-trader

jobs:
  # ── Resolve action (start|stop) from trigger type ───────────────────────────
  resolve:
    name: Resolve action
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.resolve.outputs.action }}
    steps:
      - name: Determine start or stop
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 18 ]; then
              echo "action=start" >> $GITHUB_OUTPUT
              echo "Scheduled trigger → start (UTC hour: $HOUR)"
            else
              echo "action=stop" >> $GITHUB_OUTPUT
              echo "Scheduled trigger → stop (UTC hour: $HOUR)"
            fi
          else
            echo "action=${{ inputs.action }}" >> $GITHUB_OUTPUT
            echo "Manual trigger → ${{ inputs.action }}"
          fi

  # ── Validate confirmation (manual dispatch only) ─────────────────────────────
  check:
    name: Validate confirmation
    runs-on: ubuntu-latest
    needs: resolve
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify app name
        run: |
          if [ "${{ inputs.confirm }}" != "$FLY_APP" ]; then
            echo "Confirmation does not match '$FLY_APP'. Aborting."
            exit 1
          fi

  # ── Backend → Fly.io ────────────────────────────────────────────────────────
  backend:
    name: Backend → Fly.io
    runs-on: ubuntu-latest
    needs: [resolve, check]
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      (needs.check.result == 'success' || needs.check.result == 'skipped')
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # min_machines_running = 0 in fly.toml keeps machines from auto-restarting.
      - name: Stop machines
        if: needs.resolve.outputs.action == 'stop'
        run: flyctl scale count 0 -a "$FLY_APP" --yes

      - name: Redeploy
        if: needs.resolve.outputs.action == 'start'
        run: flyctl deploy --remote-only -a "$FLY_APP"

  # ── Frontend → Vercel ───────────────────────────────────────────────────────
  frontend:
    name: Frontend → Vercel
    runs-on: ubuntu-latest
    needs: [resolve, check]
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      (needs.check.result == 'success' || needs.check.result == 'skipped')
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Remove production deployment
        if: needs.resolve.outputs.action == 'stop'
        run: |
          PROD_URL=$(vercel ls "$FLY_APP" --prod --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null \
            | grep -o 'https://[^ ]*' | head -1)
          if [ -z "$PROD_URL" ]; then
            echo "No production deployment found — already offline."
            exit 0
          fi
          echo "Removing $PROD_URL"
          vercel remove "$PROD_URL" --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment
        if: needs.resolve.outputs.action == 'start'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build
        if: needs.resolve.outputs.action == 'start'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Deploy pre-built output
        if: needs.resolve.outputs.action == 'start'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
