name: App Power
run-name: App Power — ${{ inputs.action }}

# Manual-only workflow to start or stop the app on demand.
# Automatic start/stop scheduling and EoD reports are handled by the
# Cloudflare Workers cron trigger in infra/cron-worker/.
# See docs/wiki/cloudflare-cron.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Take the app offline (stop) or bring it back online (start)'
        required: true
        type: choice
        options: [stop, start]
      confirm:
        description: 'Type the app name to confirm: offgrid-trader'
        required: true
        type: string
        default: 'offgrid-trader'

env:
  FLY_APP: offgrid-trader

jobs:
  # ── Validate confirmation ────────────────────────────────────────────────────
  check:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Verify app name
        run: |
          if [ "${{ inputs.confirm }}" != "$FLY_APP" ]; then
            echo "Confirmation does not match '$FLY_APP'. Aborting."
            exit 1
          fi

  # ── Backend → Fly.io ────────────────────────────────────────────────────────
  backend:
    name: Backend → Fly.io
    runs-on: ubuntu-latest
    needs: check
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Stop machines
        if: inputs.action == 'stop'
        run: flyctl scale count 0 -a "$FLY_APP" --yes

      - name: Redeploy
        if: inputs.action == 'start'
        run: flyctl deploy --remote-only -a "$FLY_APP"

  # ── Frontend → Vercel ───────────────────────────────────────────────────────
  frontend:
    name: Frontend → Vercel
    runs-on: ubuntu-latest
    needs: check
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Remove production deployment
        if: inputs.action == 'stop'
        run: |
          PROD_URL=$(vercel ls "$FLY_APP" --prod --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null \
            | grep -o 'https://[^ ]*' | head -1)
          if [ -z "$PROD_URL" ]; then
            echo "No production deployment found — already offline."
            exit 0
          fi
          echo "Removing $PROD_URL"
          vercel remove "$PROD_URL" --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment
        if: inputs.action == 'start'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build
        if: inputs.action == 'start'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Deploy pre-built output
        if: inputs.action == 'start'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
