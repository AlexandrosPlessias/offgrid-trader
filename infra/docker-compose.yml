# offgrid-trader — local, zero-cost AI stock monitor.
#
# Ollama and Portainer are provided by the shared infra stack.
# Start it first (safe to re-run — idempotent):
#
#   make infra                    (recommended — auto-detects GPU)
#   bash infra/start-infra.sh     (same thing)
#
# Then start this project (from the project root):
#
#   make up                       (recommended)
#   docker compose -f infra/docker-compose.yml up --build

services:

  # ── Backend API (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      OLLAMA_HOST: http://ollama:11434
      DATABASE_PATH: /app/data/offgrid_trader.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire:18889
    ports:
      - "8010:8000"
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - offgrid-net
      - ai-shared

  # ── Aspire dashboard (OpenTelemetry traces + logs UI) ───────────────────────
  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: aspire-offgrid
    restart: unless-stopped
    ports:
      - "18889:18888"
      - "4319:18889"
      - "4320:18890"
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    networks:
      - offgrid-net

  # ── Frontend UI (React / Vite → nginx) ──────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "5174:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - offgrid-net

networks:
  offgrid-net:
    driver: bridge
    driver_opts:
      # Match the WSL2 host MTU (1280, set by corporate VPN).
      # Without this Docker defaults to 1500, causing PMTUD blackholes for
      # HTTPS connections to external hosts (e.g. fred.stlouisfed.org).
      com.docker.network.driver.mtu: "1280"
  ai-shared:
    external: true
    name: ai-shared
