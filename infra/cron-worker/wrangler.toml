name = "offgrid-trader-cron"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = false

# ── Cron schedules (all times UTC) ────────────────────────────────────────────
#
# Each job is independent — EoD failing never blocks the stop, and vice-versa.
# Dual EDT/EST twins mirror app-power.yml's DST pattern; the Worker resolves
# the current Eastern offset via Intl and honours only the matching twin.
#
#   Start        8:30 AM ET  Mon–Fri  →  12:30 UTC (EDT) / 13:30 UTC (EST)
#   EoD report   5:05 PM ET  Mon–Fri  →  21:05 UTC (EDT) / 22:05 UTC (EST)
#   Stop         5:30 PM ET  Mon–Fri  →  21:30 UTC (EDT) / 22:30 UTC (EST)
#   Weekly LLM   5:25 PM ET  Fridays  →  21:25 UTC (EDT) / 22:25 UTC (EST)

[triggers]
# Free plan allows 5 cron triggers per account.
# Start uses dual EDT/EST twins for DST precision (double-start is idempotent).
# EoD, stop, weekly use a single EDT-based time — in winter (EST) they fire
# 1 h early but still after market close, so the drift is harmless.
crons = [
  "30 12 * * 1-5",  # start — 8:30 AM ET (EDT)
  "30 13 * * 1-5",  # start — 8:30 AM ET (EST)
  "5 21 * * 1-5",   # EoD report — 5:05 PM ET (EDT) / 4:05 PM ET (EST)
  "30 21 * * 1-5",  # stop — 5:30 PM ET (EDT) / 4:30 PM ET (EST)
  "25 21 * * 5",    # weekly LLM — 5:25 PM ET Fri (EDT) / 4:25 PM ET Fri (EST) — before the 21:30 stop
]

# ── Observability (free — logs + traces stored 3 days in Cloudflare) ──────────
[observability]
enabled = true
head_sampling_rate = 1   # 1 = 100% of invocations traced

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1   # 1 = 100% of invocation logs sampled

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# ── Secrets (set via: wrangler secret put <NAME>) ─────────────────────────────
# ADMIN_TOKEN   — MarketSage admin token (Authorization header for backend calls)
# BACKEND_URL   — base URL of the Fly backend, e.g. https://offgrid-trader.fly.dev
# FLY_API_TOKEN — Fly.io API token (for Machines API start/stop)
# FLY_APP       — Fly app name, e.g. offgrid-trader
#
# Never put these in wrangler.toml or commit them to the repo.
